name: Daily Options Scan

on:
  # GitHub Actions cron is UTC-only, so schedule both EDT and EST equivalents
  # and gate execution below using America/New_York local time.
  # Target run time:
  #   8:45 AM ET  -> 12:45 UTC (EDT) / 13:45 UTC (EST)
  schedule:
    - cron: "45 12 * * 1-5"
    - cron: "45 13 * * 1-5"

  # Also allows triggering manually from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      exchange:
        description: "Exchange to scan (tsx / nasdaq / all)"
        required: false
        default: "all"
      strategy:
        description: "Strategy filter (call / put / all)"
        required: false
        default: "all"
      top:
        description: "Number of top suggestions per strategy"
        required: false
        default: "10"

jobs:
  scan-and-email:
    name: Scan options and email summary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log scheduled vs actual start time
        env:
          TRIGGER_CRON: ${{ github.event.schedule || 'manual' }}
        run: |
          ACTUAL_UTC_TIME="$(date -u +'%Y-%m-%d %H:%M UTC')"
          ACTUAL_ET_TIME="$(TZ=America/New_York date +'%Y-%m-%d %H:%M %Z')"

          SCHEDULED_ET_TIME="manual / n/a"
          case "$TRIGGER_CRON" in
            "45 12 * * 1-5") SCHEDULED_ET_TIME="08:45 ET (EDT schedule)" ;;
            "45 13 * * 1-5") SCHEDULED_ET_TIME="08:45 ET (EST schedule)" ;;
          esac

          echo "Trigger event: ${{ github.event_name }}"
          echo "Scheduled cron: $TRIGGER_CRON"
          echo "Scheduled ET target: $SCHEDULED_ET_TIME"
          echo "Actual dispatch time (UTC): $ACTUAL_UTC_TIME"
          echo "Actual dispatch time (ET): $ACTUAL_ET_TIME"

      - name: Check scheduled Eastern run window
        id: schedule_guard
        if: github.event_name == 'schedule'
        env:
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          CURRENT_ET_OFFSET="$(TZ=America/New_York date +%z)"
          CURRENT_ET_HOUR="$(TZ=America/New_York date +%H)"
          CURRENT_ET_MINUTE="$(TZ=America/New_York date +%M)"
          CURRENT_ET_TIME="$(TZ=America/New_York date +'%Y-%m-%d %H:%M %Z')"
          CURRENT_UTC_TIME="$(date -u +'%Y-%m-%d %H:%M UTC')"
          CURRENT_ET_TOTAL_MINUTES=$((10#$CURRENT_ET_HOUR * 60 + 10#$CURRENT_ET_MINUTE))
          WINDOW_START_MINUTES=$((8 * 60))
          WINDOW_END_MINUTES=$((11 * 60))

          EXPECTED_CRON=""
          EXPECTED_ET_TARGET=""
          case "$CURRENT_ET_OFFSET" in
            -0400)
              EXPECTED_CRON="45 12 * * 1-5"
              EXPECTED_ET_TARGET="08:45 ET (EDT schedule)"
              ;;
            -0500)
              EXPECTED_CRON="45 13 * * 1-5"
              EXPECTED_ET_TARGET="08:45 ET (EST schedule)"
              ;;
          esac

          echo "Scheduled cron: $TRIGGER_CRON"
          echo "Expected cron for current ET offset: ${EXPECTED_CRON:-unmapped}"
          echo "Expected ET target: ${EXPECTED_ET_TARGET:-unmapped}"
          echo "Actual dispatch time (UTC): $CURRENT_UTC_TIME"
          echo "Actual dispatch time (ET): $CURRENT_ET_TIME"

          if [ -z "$EXPECTED_CRON" ]; then
            echo "run_scan=false" >> "$GITHUB_OUTPUT"
            echo "Failing scheduled scan because ET offset $CURRENT_ET_OFFSET is not mapped to an 8:45 ET cron."
            exit 1
          elif [ "$TRIGGER_CRON" != "$EXPECTED_CRON" ]; then
            echo "run_scan=false" >> "$GITHUB_OUTPUT"
            echo "Failing scheduled scan for cron '$TRIGGER_CRON'; expected '$EXPECTED_CRON' for ET offset $CURRENT_ET_OFFSET."
            exit 1
          elif [ "$CURRENT_ET_TOTAL_MINUTES" -lt "$WINDOW_START_MINUTES" ] || [ "$CURRENT_ET_TOTAL_MINUTES" -gt "$WINDOW_END_MINUTES" ]; then
            echo "run_scan=false" >> "$GITHUB_OUTPUT"
            echo "Failing scheduled scan because it started at $CURRENT_ET_TIME, outside the allowed ET dispatch window (08:00 through 11:00, with 11:00 as the latest accepted minute)."
            exit 1
          else
            echo "run_scan=true" >> "$GITHUB_OUTPUT"
            echo "Running scheduled scan for cron '$TRIGGER_CRON' at $CURRENT_ET_TIME within the allowed ET dispatch window (08:00 through 11:00, with 11:00 as the latest accepted minute)."
          fi

      - name: Set up Python
        if: github.event_name != 'schedule' || steps.schedule_guard.outputs.run_scan == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.schedule_guard.outputs.run_scan == 'true'
        run: pip install -r requirements.txt

      - name: Run scanner and send email
        if: github.event_name != 'schedule' || steps.schedule_guard.outputs.run_scan == 'true'
        env:
          # ── Set these secrets in:
          #    GitHub repo → Settings → Secrets and variables → Actions → New repository secret
          #
          # SMTP_USER     : your Gmail address  (e.g. yourname@gmail.com)
          # SMTP_PASSWORD : Gmail App Password   (NOT your regular password)
          #                 Generate one at https://myaccount.google.com/apppasswords
          #                 (requires 2-Step Verification to be enabled on your Google account)
          # EMAIL_TO      : recipient address(es), comma-separated (can be the same as SMTP_USER)
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python main.py \
            --exchange "${{ github.event.inputs.exchange || 'all' }}" \
            --strategy "${{ github.event.inputs.strategy || 'all' }}" \
            --top      "${{ github.event.inputs.top     || '10'  }}" \
            --apply-targets \
            --email    "${{ secrets.EMAIL_TO }}"

      - name: Persist updated portfolio state
        if: github.event_name != 'schedule' || steps.schedule_guard.outputs.run_scan == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add portfolio_state.json

          if git diff --cached --quiet; then
            echo "No portfolio state changes to commit."
            exit 0
          fi

          git commit -m "chore(actions): update portfolio state [skip ci]"
          git push
