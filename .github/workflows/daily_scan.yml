name: Daily Options Scan

on:
  # Runs at 15:15 UTC on weekdays = 11:15 AM Eastern Time / 12:15 PM Atlantic Time
  # This intentionally waits until well after the open so Yahoo's options
  # chains have live bids instead of the mostly-zero chains often seen at 9:30 ET.
  # Adjust the cron expression if you want a different time:
  #   "30 14 * * 1-5"  = 10:30 AM ET / 11:30 AM ADT
  #   "15 15 * * 1-5"  = 11:15 AM ET / 12:15 PM ADT
  #   "30 15 * * 1-5"  = 11:30 AM ET / 12:30 PM ADT
  #   "0  21 * * 1-5"  = 5:00 PM ET / 6:00 PM ADT (after-hours)
  schedule:
    - cron: "15 15 * * 1-5"

  # Also allows triggering manually from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      exchange:
        description: "Exchange to scan (tsx / nasdaq / all)"
        required: false
        default: "all"
      strategy:
        description: "Strategy filter (call / put / all)"
        required: false
        default: "all"
      top:
        description: "Number of top suggestions per strategy"
        required: false
        default: "10"

jobs:
  scan-and-email:
    name: Scan options and email summary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner and send email
        env:
          # ── Set these secrets in:
          #    GitHub repo → Settings → Secrets and variables → Actions → New repository secret
          #
          # SMTP_USER     : your Gmail address  (e.g. yourname@gmail.com)
          # SMTP_PASSWORD : Gmail App Password   (NOT your regular password)
          #                 Generate one at https://myaccount.google.com/apppasswords
          #                 (requires 2-Step Verification to be enabled on your Google account)
          # EMAIL_TO      : recipient address(es), comma-separated (can be the same as SMTP_USER)
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python main.py \
            --exchange "${{ github.event.inputs.exchange || 'all' }}" \
            --strategy "${{ github.event.inputs.strategy || 'all' }}" \
            --top      "${{ github.event.inputs.top     || '10'  }}" \
            --apply-targets \
            --email    "${{ secrets.EMAIL_TO }}"

      - name: Persist updated portfolio state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add portfolio_state.json

          if git diff --cached --quiet; then
            echo "No portfolio state changes to commit."
            exit 0
          fi

          git commit -m "chore(actions): update portfolio state [skip ci]"
          git push
